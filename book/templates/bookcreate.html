{% extends 'base.html' %}

{%block 'title' %}Add Book | BMS{%endblock%}

{% block 'content' %}
<div class='book-form'>
    <div class='container'>
        <form method='post' enctype='multipart/form-data' class='flex flex-column gap-5'>
            {% csrf_token %}
            {{form.as_div}}
            <button type='submit'>Add Book</button>
        </form>
    </div>
</div>
{%endblock%}
